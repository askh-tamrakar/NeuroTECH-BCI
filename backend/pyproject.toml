# ─────────────────────────────────────────────────────────────────────────────
# NeuroTECH-BCI  ·  Backend  ·  pyproject.toml
# Python >= 3.10  (union-type syntax used in eeg_lda_trainer.py)
# ─────────────────────────────────────────────────────────────────────────────

# ── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ─────────────────────────────────────────────────────────
[project]
name        = "neurotech-bci-backend"
version     = "0.2.0"
description = "NeuroTECH-BCI: unified EMG/EOG/EEG acquisition, filtering, feature extraction, ML training and web server."
readme      = "README.md"
license     = { text = "MIT" }
authors     = [
    { name = "NeuroTECH Team" },
]
requires-python = ">=3.10"

# Core runtime dependencies (mirrors requirements.txt)
dependencies = [
    # Web server & real-time comms
    "fastapi>=0.115.0",
    "python-socketio>=5.5.0",
    "uvicorn>=0.32.0",

    # Scientific computing
    "numpy>=1.26.0,<3.0.0",
    "scipy>=1.12.0",
    "pandas>=2.0.0",

    # Machine learning
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",

    # BCI / signal acquisition
    "pylsl>=1.16.2",
    "pyserial>=3.5",

    # Signal visualization (acquisition GUI)
    "matplotlib>=3.8.0",

    # HID actuation
    "pynput>=1.7.7",
]

# ── Optional dependency groups ────────────────────────────────────────────────
[project.optional-dependencies]

# Development & testing tools
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

# NeuroBench signal simulator (src/utils/neurobench.py)
# Install with:  pip install -e ".[neurobench]"
neurobench = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.0",
    "brainflow>=5.12.0",
]

# All optional groups combined
all = [
    "neurotech-bci-backend[dev,neurobench]",
]

# ── Console entry points ──────────────────────────────────────────────────────
[project.scripts]
neurotech      = "pipeline:main"          # main system orchestrator
neurotech-sim  = "src.utils.neurobench:main"  # signal simulator (requires [neurobench])

# ── Setuptools package discovery ─────────────────────────────────────────────
[tool.setuptools]
package-dir = { "" = "." }              # root contains pipeline.py, launcher.py

[tool.setuptools.packages.find]
where   = ["."]
include = ["src*"]                      # include all sub-packages under src/
exclude = ["tests*", "*.egg-info"]

[tool.setuptools.package-data]
"src.utils"  = ["*.json"]              # config JSON files shipped with utils
"src.config" = ["*.json", "*.toml"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 120
target-version = "py310"
src            = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501",   # line too long  (black handles it)
    "E711",   # comparison to None (common in pandas)
    "E712",   # comparison to True/False
    "F401",   # imported but unused (many conditional imports)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Black (formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length    = 120
target-version = ["py310", "py311", "py312"]

# ── Mypy (type checker) ───────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.10"
ignore_missing_imports = true
warn_return_any        = false
warn_unused_ignores    = false
exclude                = [
    "tests/",
    "setup_conda_env\\.py",
]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts      = "-v --tb=short --basetemp=.pytest_tmp"
