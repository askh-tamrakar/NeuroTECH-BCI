# ─────────────────────────────────────────────────────────────────────────────
# NeuroTECH-BCI — Docker Compose
#
#  Services:
#    backend   → Python 3.11 Flask-SocketIO API on :5005 (internal)
#    frontend  → Nginx serving Vite build on :1972 (host-mapped)
#
#  Usage:
#    docker compose up --build          # Build & start both services
#    docker compose up --build frontend # Rebuild only the frontend
#    docker compose up --build backend  # Rebuild only the backend
#    docker compose down                # Stop & remove containers
#    docker compose logs -f             # Stream logs from all services
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurotech-backend
    restart: unless-stopped

    # Expose the API/WS port to the host for direct debugging (optional)
    ports:
      - "5005:5005"

    # Persist acquired BCI data and logs across container restarts
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/bci_data

    environment:
      # Flask/eventlet settings
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5005/api/status')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - neurotech-net

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty → Nginx proxy handles the routing inside the container
        VITE_API_URL: ""
    container_name: neurotech-frontend
    restart: unless-stopped

    # Map Nginx port 80 → host port 1972 (matches Vite dev port convention)
    ports:
      - "1972:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - neurotech-net

# ── Named Volumes ───────────────────────────────────────────────────────────────
volumes:
  backend_logs:
    driver: local
  backend_data:
    driver: local

# ── Network ─────────────────────────────────────────────────────────────────────
networks:
  neurotech-net:
    driver: bridge
